apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notes-api-dev
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: notes-api
configMapGenerator:
  - name: notes-api-config
    behavior: replace
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=debug
